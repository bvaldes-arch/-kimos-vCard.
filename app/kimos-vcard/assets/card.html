<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Tarjeta digital</title>
<meta name="robots" content="noindex">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="generator" content="KIMOS vCard 2.0.1">
<link rel="icon" href="logo-mark.png">
<style>
  html, body { margin: 0; padding: 0; background: #F8FAFC; min-height: 100%; }
  #kvc-root { min-height: 100vh; display: flex; flex-direction: column; } #kvc-root > * { flex: 1; }
  .kvc-wait { min-height: 100vh; display: grid; place-items: center; font: 600 14px/1.4 -apple-system, "Segoe UI", Roboto, sans-serif; color: #64748B; text-align: center; padding: 24px; }
</style>
</head>
<body>
<div id="kvc-root"><div class="kvc-wait">Cargando tarjeta…</div></div>
<script src="kvc-core.js"></script>
<script>
/* Página pública de KIMOS vCard: {api}/api/apps/kimos-vcard/asset/card.html?i={instancia}
   Lee SOLO lo publicado (/api/public/app/{i}/definition) y pinta la tarjeta. */
(function () {
  var root = document.getElementById('kvc-root');
  function fail(msg) {
    var d = document.createElement('div'); d.className = 'kvc-wait'; d.textContent = msg;
    root.replaceChildren(d);
  }
  var id = new URLSearchParams(location.search).get('i') || '';
  if (!/^[\w-]{4,128}$/.test(id)) { fail('Enlace de tarjeta incompleto.'); return; }
  var here = location.href.split('#')[0];
  var api = here.split('/api/apps/')[0];
  var assetBase = here.split('?')[0].replace(/[^/]*$/, '');
  fetch(api + '/api/public/app/' + encodeURIComponent(id) + '/definition', { cache: 'no-cache' })
    .then(function (r) {
      if (r.status === 403) throw new Error('Esta tarjeta no está publicada.');
      if (!r.ok) throw new Error('Tarjeta no encontrada.');
      return r.json();
    })
    .then(function (j) {
      var prof = j && j.data && j.data.profile;
      if (!prof || !prof.name) throw new Error('Esta tarjeta no está publicada.');
      // Equipo (v2.0): ?m=clave abre la tarjeta de esa persona con la marca compartida.
      var mKey = new URLSearchParams(location.search).get('m') || '';
      var member = null;
      if (mKey) {
        var entry = (j.data.team || []).filter(function (t) { return t && t.key === mKey; })[0];
        if (!entry) throw new Error('Esta tarjeta del equipo ya no está publicada.');
        prof = KVC.teamMerge(prof, entry.profile);
        member = { key: mKey };
      }
      document.title = prof.name + (prof.title ? ' · ' + prof.title : '') + (prof.company ? ' · ' + prof.company : '');
      KVC.injectCss();
      // El QR de la página apunta SIEMPRE a una URL real y abrible: el dominio
      // propio si la tarjeta declara uno, si no esta misma página.
      var qLang = new URLSearchParams(location.search).get('lang');
      KVC.mount(root, prof, {
        // El QR de una tarjeta del equipo apunta a ESA tarjeta, no a la principal.
        qrUrl: (member ? '' : prof.publicUrl) || here.replace(/([?&])lang=[^&]*&?/, '$1').replace(/[?&]$/, ''),
        resolve: function (n) { return assetBase + n; },
        lang: qLang === 'en' || qLang === 'es' ? qLang : undefined,
        // «Déjame tus datos» llega a la app como prospecto (gateway public.submit).
        leadEndpoint: j.data.leads === true ? api + '/api/public/app/' + encodeURIComponent(id) + '/submit/lead' : '',
        // Medición (v1.3): una visita por apertura, con los canales tocados.
        statsEndpoint: j.data.stats === true ? api + '/api/public/app/' + encodeURIComponent(id) + '/submit/visita' : '',
        source: 'tarjeta KIMOS',
        member: member
      });
      // Atajo en la pantalla de inicio: ícono con la foto y nombre corto.
      var icon = prof.photo ? (prof.photo.indexOf('asset:') === 0 ? assetBase + prof.photo.slice(6) : prof.photo) : '';
      if (icon) { var l = document.createElement('link'); l.rel = 'apple-touch-icon'; l.href = icon; document.head.appendChild(l); }
      var t = document.createElement('meta'); t.name = 'apple-mobile-web-app-title';
      t.content = (prof.name || '').split(' ')[0] + (prof.company ? ' · ' + prof.company : ''); document.head.appendChild(t);
      var c = document.createElement('meta'); c.name = 'theme-color'; c.content = (prof.theme && prof.theme.primary) || '#0052FF'; document.head.appendChild(c);
    })
    .catch(function (e) { fail(e && e.message ? e.message : 'No se pudo cargar la tarjeta.'); });
})();
</script>
</body>
</html>
